name: Build Android APK

# Manual run: GitHub -> Actions -> "Build Android APK" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          pip install pillow
          python3 scripts/brand_android.py
          npx cap sync android
          # unique, increasing versionCode so new APKs install over old ones
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Signing with your release key"
            ./gradlew assembleRelease
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
            "$BT/zipalign" -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KS_PASS --key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
              --out "$GITHUB_WORKSPACE/DeepuVerma.apk" "$RUNNER_TEMP/aligned.apk"
          else
            echo "No signing secrets found - building a debug-signed APK (fine for personal use)"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/DeepuVerma.apk"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" DeepuVerma.apk \
            --title "Deepu Verma app build ${{ github.run_number }}" \
            --notes "Android app of the portfolio website." \
            --target "${{ github.sha }}" --latest
